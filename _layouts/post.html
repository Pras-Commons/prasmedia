---
layout: default
---
<article class="post">
  <span class="tag">{{ page.category | default: "Artikel" }}</span>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%d %B %Y" }}</p>
  {% if page.image %}<img src="{{ page.image }}" alt="{{ page.title }}">{% endif %}
  <div class="body">{{ content }}</div>
</article>
